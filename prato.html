<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Prato - Insegna Archeologica</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
      // Componente per i link esterni (Strada)
      AFRAME.registerComponent('link-to', {
        schema: { type: 'string', default: '' },
        init: function () {
          this.el.addEventListener('click', () => {
            window.location.href = this.data;
          });
        }
      });

      // Componente per aprire il pop-up Insegna (SINCRO AUDIO CORRETTA)
      AFRAME.registerComponent('insegna-inspector', {
        init: function () {
          const modal = document.querySelector('#modal-insegna');
          const audio = document.querySelector('#audio-lettura');
          const sky = document.querySelector('a-sky');

          this.el.addEventListener('click', () => {
            // 1. Mostra subito il pop-up grafico
            modal.setAttribute('visible', 'true');
            sky.setAttribute('color', '#555'); // Scurisce lo sfondo per focus

            // 2. Aspetta 400ms prima di far partire l'audio
            // Permette al browser di renderizzare l'immagine prima che inizi la voce
            setTimeout(() => {
              // Avvia l'audio solo se l'utente non ha chiuso subito il pop-up
              if (modal.getAttribute('visible') === true) {
                audio.play();
              }
            }, 400); 
          });
        }
      });

      // Componente per chiudere il pop-up
      AFRAME.registerComponent('close-insegna', {
        init: function () {
          const modal = document.querySelector('#modal-insegna');
          const audio = document.querySelector('#audio-lettura');
          const sky = document.querySelector('a-sky');

          this.el.addEventListener('click', (e) => {
            e.stopPropagation();
            modal.setAttribute('visible', 'false');
            sky.setAttribute('color', '#ECECEC'); // Ripristina lo sfondo luminoso
            audio.pause(); // Ferma l'audio
            audio.currentTime = 0; // Resetta la traccia dall'inizio
          });
        }
      });
    </script>
  </head>

  <body>
    <a-scene>
      <!-- Audio insegna -->
      <a-assets>
        <img id="insegna" src="img/insegna.jpg"> 
        <audio id="audio-lettura" src="mp3/insegna.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Ambientazione con immagine 360 -->
      <a-sky src="img/prato.jpg" rotation="0 -90 0" color="#ECECEC"></a-sky>
      
      <!-- Camera + cursor per guardarsi intorno (posizione del player) -->
      <a-entity id="rig" position="0 1.7 0">
        <a-entity camera look-controls>
          <a-entity cursor="fuse: true; fuseTimeout: 1000"
                    position="0 0 -1" 
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: white; shader: flat">
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- ═══ PORTALE verso la strada ═══  -->
      <a-entity 
        position="4 0.5 8" 
        link-to="strada.html">

        <!-- Anello visivo del portale -->
        <a-torus 
          color="#755436" 
          position="0 0 0"
          radius="0.7" 
          radius-tubular="0.04" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle 
          radius="0.7" 
          position="0 0 0"
          color="#755436" 
          opacity="0.4" 
          side="double">
        </a-circle>

        <!-- Etichetta testuale -->
        <a-text value="Strada" 
          align="center" 
          color="black" 
          position="0 -1 0" 
          rotation="0 210 0" 
          width="10">
        </a-text>
      </a-entity>

      <!-- ═══ PORTALE verso l'insegna ═══  -->
      <a-entity 
        position="0 10 -15" 
        rotation="45 0 0" 
        insegna-inspector>

        <!-- Anello visivo del portale -->
        <a-torus 
          color="#755436" 
          position="0 0 0"
          radius="1.2" 
          radius-tubular="0.06" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle 
          radius="1.2" 
          position="0 0 0"
          color="#755436" 
          opacity="0.6" 
          side="double">
        </a-circle>
        
        <!-- Etichetta testuale -->
        <a-text 
          value="Leggi Insegna" 
          align="center" 
          color="white" 
          position="0 0 0.1" 
          width="17">
        </a-text>
      </a-entity>

      <!-- Immagine insegna -->
      <a-entity id="modal-insegna" position="0 1.7 -2.5" visible="false">
        
        <a-plane 
          color="#111" 
          width="3.6" 
          height="2.2" 
          opacity="0.95" 
          position="0 0.1 -0.01">
        </a-plane>
        
        <a-image 
          src="#insegna" 
          width="3.3" 
          height="1.8" 
          position="0 0.22 0"
          material="shader: standard; repeat: 1 1; npot: true; anisotropy: 16">
        </a-image>

        <a-entity position="0 -1.1 0" close-insegna>
          <a-box color="#ff3333" width="0.8" height="0.25" depth="0.05"></a-box>
          <a-text value="CHIUDI" align="center" color="white" position="0 0 0.03" width="3.5"></a-text>
        </a-entity>

      </a-entity>

    </a-scene>
  </body>
</html>
