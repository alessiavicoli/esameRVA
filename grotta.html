<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>360° Image Sky - A-Frame</title>
    <meta name="description" content="360&deg; Image - A-Frame">
    <!-- Libreria A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
    // Componente custom: al click reindirizza a un'altra pagina
    AFRAME.registerComponent('link-to', {
      schema: { type: 'string', default: '' },
      init: function () {
        this.el.addEventListener('click', () => {
          // Trucco dello sblocco preventivo dell'audio
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            const ctx = new AudioContext();
            ctx.resume();
          }
          // Cambia pagina verso la tomba
          window.location.href = this.data;
        });
      }
    });
  </script>
  </head>
  
  <body>
    <a-scene>
      <!-- Ambientazione con immagine 360 -->
      <a-sky src="img/grotta.jpg" rotation="0 -90 0" color="#ECECEC"></a-sky>
      
      <!-- Camera + cursor per guardarsi intorno (posizione del player) -->
      <a-entity id="rig" position="0 1.7 0">
          <a-entity camera look-controls wasd-controls>
            <a-entity 
                cursor="fuse: true; fuseTimeout: 1000"
                position="0 0 -1" 
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                material="color: white; shader: flat">
            </a-entity>

          <!-- ═══ Piantina ═══  -->
          <a-entity
            id="interfaccia-piantina"
            position="1.3 -0.5 -1" 
            rotation="0 0 0"
            scale="1 1 1">
            
            <a-plane
              width="0.36"
              height="0.31"
              position="0 0 -0.01"
              color="#222"
              opacity="0.6">
            </a-plane>

            <a-image 
              src="img/pgrotta.jpg" 
              width="0.70" 
              height="0.50" 
              position="0 0 0"
              material="shader: flat; npot: true; anisotropy: 16">
            </a-image>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- ═══ PORTALE verso l'ingresso ═══  -->
      <a-entity
        position="1.5 -0.3 8" 
        rotation="0 180 0"
        link-to="ingresso.html">

        <!-- Anello visivo del portale -->
        <a-torus
          color="#755436"
          position="0 0 0"
          radius="0.7"
          radius-tubular="0.04"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle
          radius="0.7"
          position="0 0 0"
          color="#755436"
          opacity="0.4"
          side="double">
        </a-circle>

        <!-- Etichetta testuale -->
        <a-text
          value="Ingresso"
          align="center"
          color="black"
          position="0 -1 0.05"
          rotation="0 20 0"
          side="double"
          width="10">
        </a-text>
      </a-entity>

      <!-- ═══ PORTALE verso il registro ═══  -->
      <a-entity
        position="-14 0 -10" 
        link-to="registro.html">

        <!-- Anello visivo del portale -->
        <a-torus
          color="#755436"
          position="0 0 0"
          radius="1"
          radius-tubular="0.06"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle
          radius="1"
          position="0 0 0"
          color="#755436"
          opacity="0.4"
          side="double">
        </a-circle>

        <!-- Etichetta testuale -->
        <a-text
          value="Registro"
          align="center"
          color="black"
          position="0 -1.5 0"
          rotation="0 45 0"
          width="12">
        </a-text>
      </a-entity>

      <!-- ═══ PORTALE verso la tomba ═══  -->
      <a-entity
        position="-1.5 -0.7 -10" 
        link-to="tomb.html">

        <!-- Anello visivo del portale -->
        <a-torus
          color="#755436"
          position="0 0 0"
          radius="0.9"
          radius-tubular="0.06"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle
          radius="0.9"
          position="0 0 0"
          color="#755436"
          opacity="0.4"
          side="double">
        </a-circle>

        <!-- Etichetta testuale -->
        <a-text
          value="→ Tomba"
          align="center"
          color="black"
          position="0 -1.4 0"
          width="15">
        </a-text>
      </a-entity>

    </a-scene>
  </body>
</html>
