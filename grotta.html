<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>360° Image Sky - A-Frame</title>
    <meta name="description" content="360&deg; Image - A-Frame">
    <!-- Libreria A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
    // Componente custom: al click reindirizza a un'altra pagina
    AFRAME.registerComponent('link-to', {
      schema: { type: 'string', default: '' },
      init: function () {
        this.el.addEventListener('click', () => {
          window.location.href = this.data;
        });
      }
    });
  </script>
  </head>
  <body>
    <a-scene>
      <!-- Ambientazione con immagine 360 -->
      <a-sky src="img/grotta.jpg" rotation="0 -90 0" color="#ECECEC"></a-sky>
      
      <!-- Camera + cursor per guardarsi intorno (posizione del player) -->
      <a-entity id="rig" position="0 1.7 0">
          <a-entity camera look-controls wasd-controls>
            <a-entity 
                cursor="fuse: true; fuseTimeout: 1000"
                position="0 0 -1" 
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                material="color: white; shader: flat">
            </a-entity>
        </a-entity>
    </a-entity>

      <!-- ═══ PORTALE verso il corridoio ═══  -->
      <a-entity
        position="3.760 -5 28" 
        link-to="corridoio.html">

        <!-- Anello visivo del portale -->
        <a-torus
          color="#755436"
          position="0 0 0"
          radius="0.6"
          radius-tubular="0.05"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle
          radius="0.6"
          position="0 0 0"
          color="#755436"
          opacity="0.4">
        </a-circle>

        <!-- Etichetta testuale -->
        <a-text
          value="→ Corridoio"
          align="center"
          color="black"
          position="1 -1 0"
          rotation="0 180 0"
          side="double"
          width="8">
        </a-text>

      </a-entity>

      <!-- ═══ PORTALE verso il registro ═══  -->
      <a-entity
        position="-37 -2 -27" 
        link-to="registro.html">

        <!-- Anello visivo del portale -->
        <a-torus
          color="#755436"
          position="0 0 0"
          radius="0.6"
          radius-tubular="0.05"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle
          radius="0.6"
          position="0 0 0"
          color="#755436"
          opacity="0.4"
          side="double">
        </a-circle>

        <!-- Etichetta testuale -->
        <a-text
          value="→ Registro"
          align="center"
          color="black"
          position="-1.25 -1 0"
          width="15">
        </a-text>
      </a-entity>

      <!-- ═══ PORTALE verso la tomba ═══  -->
      <a-entity
        position="-2.5 -1 -18" 
        link-to="tomba.html">

        <!-- Anello visivo del portale -->
        <a-torus
          color="#755436"
          position="0 0 0"
          radius="0.6"
          radius-tubular="0.05"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle
          radius="0.6"
          position="0 0 0"
          color="#755436"
          opacity="0.4"
          side="double">
        </a-circle>

        <!-- Etichetta testuale -->
        <a-text
          value="→ Tomba"
          align="center"
          color="black"
          position="-1 -1 0"
          width="15">
        </a-text>
      </a-entity>
    </a-scene>
  </body>
</html>
