<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>360° Image Sky - A-Frame</title>
    <meta name="description" content="360&deg; Image - A-Frame">
    <!-- Libreria A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
    // Componente custom: al click reindirizza a un'altra pagina
    AFRAME.registerComponent('link-to', {
      schema: { type: 'string', default: '' },
      init: function () {
        this.el.addEventListener('click', () => {
          window.location.href = this.data;
        });
      }
    });
  </script>
  </head>

  <body>
    <a-scene>
      <!-- Ambientazione con immagine 360 -->
      <a-sky src="img/registro.jpg" rotation="0 -90 0" color="#ECECEC"></a-sky>
      
      <!-- Camera + cursor per guardarsi intorno (posizione del player) -->
      <a-entity id="rig" position="0 1.7 0">
          <a-entity camera look-controls wasd-controls>
            <a-entity 
                cursor="fuse: true; fuseTimeout: 1000"
                position="0 0 -1" 
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                material="color: white; shader: flat">
            </a-entity>

          <!-- ═══ Piantina ═══  -->
          <a-entity
            id="interfaccia-piantina"
            position="1.3 -0.5 -1" 
            rotation="0 0 0"
            scale="1 1 1">
            
            <a-plane
              width="0.36"
              height="0.31"
              position="0 0 -0.01"
              color="#222"
              opacity="0.6">
            </a-plane>

            <a-image 
              src="img/pregistro.jpg" 
              width="0.70" 
              height="0.50" 
              position="0 0 0"
              material="shader: flat; npot: true; anisotropy: 16">
            </a-image>
          </a-entity>
        </a-entity>
    </a-entity>

      <!-- ═══ PORTALE verso il corridoio ═══  -->
      <a-entity
        position="-10 -0.3 9" 
        link-to="ingresso.html">

        <!-- Anello visivo del portale -->
        <a-torus
          color="#755436"
          position="0 0 0"
          radius="1"
          radius-tubular="0.06"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle
          radius="1"
          position="0 0 0"
          color="#755436"
          opacity="0.4"
          side="double">
        </a-circle>

        <!-- Etichetta testuale -->
        <a-text
          value="Ingresso"
          align="center"
          color="black"
          position="0 -1.50 0"
          rotation="0 130 0"
          side="double"
          width="15">
        </a-text>
      </a-entity>   

      <!-- ═══ PORTALE verso la tomba ═══  -->
      <a-entity
        position="-1.5 -1 12.5" 
        link-to="tomb.html">

        <!-- Anello visivo del portale -->
        <a-torus
          color="#755436"
          position="0 0 0"
          radius="1"
          radius-tubular="0.06"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <!-- Superficie interna del portale (piano semitrasparente) -->
        <a-circle
          radius="1"
          position="0 0 0"
          color="#755436"
          opacity="0.4"
          side="double">
        </a-circle>

        <!-- Etichetta testuale -->
        <a-text
          value="Tomba"
          align="center"
          color="black"
          position="0 -1.50 0"
          rotation="0 180 0"
          side="double"
          width="15">
        </a-text>
      </a-entity>

      <!-- ═══ PORTALE verso il prato ═══  -->
      <a-entity
        position="-20 1.4 3" 
        rotation="0 90 0"
        link-to="prato.html">

        <a-torus
          color="#755436"
          position="0 0 0"
          radius="1.4"
          radius-tubular="0.08"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-torus>

        <a-circle
          radius="1.4"
          position="0 0 0"
          color="#755436"
          opacity="0.4"
          side="double">
        </a-circle>

        <a-text
          value="Prato"
          align="center"
          color="black"
          position="0 -1.95 0"
          width="20">
        </a-text>
      </a-entity>

      <!-- ═══ Libri ═══  -->
      <a-entity
        gltf-model="models/hard_cover_books.glb"
        position="-27 -18 -13"
        scale="0.3 0.3 0.3"
        rotation="0 200 0">
      </a-entity>

    </a-scene>
  </body>
</html>
