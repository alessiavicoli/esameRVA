<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ispezione Tomba 3D - A-Frame (Con Audio Sincronizzato)</title>
    <meta name="description" content="360&deg; Image - A-Frame">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
    
    // Componente per tornare alla pagina principale della grotta IMMEDIATAMENTE al puntamento
    AFRAME.registerComponent('link-to', {
      schema: { type: 'string', default: '' },
      init: function () {
        // Cambiato da 'click' a 'mouseenter'
        this.el.addEventListener('mouseenter', () => {
          const audio = document.querySelector('#audio-tomba');
          if (audio) {
            audio.pause();
            audio.currentTime = 0;
          }
          window.location.href = this.data;
        });
      }
    });

    // Componente: Gestisce rotazione, drag e avvio dell'audio sbloccato al click
    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        this.ifMouseDown = false;
        this.x_coord = 0;
        this.y_coord = 0;

        const audio = document.querySelector('#audio-tomba');

        // Funzione per tentare la riproduzione dell'audio
        const playAudio = () => {
          if (audio && audio.paused) {
            audio.play()
              .then(() => {
                console.log("Audio avviato con successo!");
                // Rimuoviamo i listener di sblocco una volta che l'audio è partito
                document.removeEventListener('click', playAudio);
                document.removeEventListener('keydown', playAudio);
              })
              .catch((err) => {
                console.log("Autoplay bloccato dal browser. In attesa di un click dell'utente.");
              });
          }
        };

        // 1. Tenta l'audio in automatico appena il modello 3D è caricato
        this.el.addEventListener('model-loaded', () => {
          setTimeout(playAudio, 200);
        });

        // 2. SBLOCCO DI SICUREZZA: se l'autoplay fallisce, l'audio parte al primissimo click dell'utente sulla pagina
        document.addEventListener('click', playAudio);
        document.addEventListener('keydown', playAudio);

        // Eventi del drag (identici a prima)
        document.addEventListener('mousedown', (e) => {
          this.ifMouseDown = true;
          this.x_coord = e.clientX;
          this.y_coord = e.clientY;
          if (this.el.components.animation) this.el.components.animation.pause();
        });
        
        document.addEventListener('mouseup', () => {
          this.ifMouseDown = false;
          if (this.el.components.animation) this.el.components.animation.play();
        });
        
        document.addEventListener('mousemove', (e) => {
          if (this.ifMouseDown) {
            const deltaX = e.clientX - this.x_coord;
            const deltaY = e.clientY - this.y_coord;
            const rotation = this.el.getAttribute('rotation');
            rotation.y += deltaX * 0.5;
            rotation.x += deltaY * 0.5;
            if (rotation.x > 80) rotation.x = 80;
            if (rotation.x < -80) rotation.x = -80;
            this.el.setAttribute('rotation', rotation);
            this.x_coord = e.clientX;
            this.y_coord = e.clientY;
          }
        });
      }
    });
  </script>
  </head>

  <body>
    <a-scene raycaster="objects: [link-to], #modello-fotogrammetrico">
      <a-assets>
        <a-asset-item id="modello-tomba" src="models/tomba.glb"></a-asset-item>
        <audio id="audio-tomba" src="mp3/tomba.mp3" preload="auto"></audio>
      </a-assets>

      <a-sky src="img/grotta.jpg" rotation="0 -90 0" color="#555555"></a-sky>
      
      <a-entity id="rig" position="0 1.7 0">
        <a-entity camera look-controls wasd-controls="enabled: false">
          <a-entity 
              cursor="fuse: false;" 
              position="0 0 -1" 
              geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
              material="color: white; shader: flat">
          </a-entity>

          <!-- ═══ Piantina ═══  -->
          <a-entity
            id="interfaccia-piantina"
            position="-1.3 -0.5 -1" 
            rotation="0 0 0"
            scale="1 1 1">
            
            <a-plane
              width="0.36"
              height="0.31"
              position="0 0 -0.01"
              color="#222"
              opacity="0.6">
            </a-plane>

            <a-image 
              src="img/ptomba.jpg" 
              width="0.70" 
              height="0.50" 
              position="0 0 0"
              material="shader: flat; npot: true; anisotropy: 16">
            </a-image>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="tomba-modal" position="0 1.7 -3">
        
        <a-entity light="type: ambient; intensity: 0.7"></a-entity>
        <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>

        <a-entity 
          id="modello-fotogrammetrico" 
          gltf-model="#modello-tomba" 
          position="0 -0.5 0" 
          scale="0.8 0.8 0.8"
          drag-rotate
          animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
        </a-entity>

        <a-plane 
          color="#222" 
          width="2.8" 
          height="0.4" 
          position="0 1.1 0.2" 
          opacity="0.8">
        </a-plane>

        <a-text 
          value="Rotazione automatica attiva. Trascina per esplorare." 
          align="center" 
          color="white" 
          position="0 1.1 0.3" 
          width="3.5">
        </a-text>

        <a-entity 
          id="btn-indietro" 
          position="0 -1.2 0" 
          link-to="grotta.html">

          <a-box 
            color="#ff3333" 
            width="1.2" 
            height="0.3" 
            depth="0.1">
          </a-box>

          <a-text 
            value="TORNA ALLA GROTTA" 
            align="center" 
            color="white" 
            position="0 0 0.06" 
            width="3.5">
          </a-text>
        </a-entity>

      </a-entity>

    </a-scene>
  </body>
</html>
