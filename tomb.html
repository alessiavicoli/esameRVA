<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ispezione Tomba 3D - A-Frame</title>
    <meta name="description" content="360&deg; Image - A-Frame">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
    // Componente per tornare alla pagina principale della grotta
    AFRAME.registerComponent('link-to', {
      schema: { type: 'string', default: '' },
      init: function () {
        this.el.addEventListener('click', () => {
          window.location.href = this.data;
        });
      }
    });

    // Componente per ruotare manualmente il modello trascinando il mouse
    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        this.ifMouseDown = false;
        this.x_coord = 0;
        
        document.addEventListener('mousedown', (e) => {
          this.ifMouseDown = true;
          this.x_coord = e.clientX;
          if(this.el.components.animation) {
            this.el.components.animation.pause(); // Pausa rotazione automatica
          }
        });
        
        document.addEventListener('mouseup', () => {
          this.ifMouseDown = false;
          if(this.el.components.animation) {
            this.el.components.animation.play(); // Riattiva rotazione automatica
          }
        });
        
        document.addEventListener('mousemove', (e) => {
          if (this.ifMouseDown) {
            const constrainDeltaX = e.clientX - this.x_coord;
            const rotation = this.el.getAttribute('rotation');
            rotation.y += constrainDeltaX * 0.5;
            this.el.setAttribute('rotation', rotation);
            this.x_coord = e.clientX;
          }
        });
      }
    });
  </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="modello-tomba" src="models/tomba.glb"></a-asset-item>
      </a-assets>

      <a-sky src="img/grotta.jpg" rotation="0 -90 0" color="#555555"></a-sky>
      
      <a-entity id="rig" position="0 1.7 0">
        <a-entity camera look-controls wasd-controls="enabled: false">
          <a-entity 
              cursor="fuse: true; fuseTimeout: 1000"
              position="0 0 -1" 
              geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
              material="color: white; shader: flat">
          </a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="tomba-modal" position="0 1.7 -3">
        
        <a-entity light="type: ambient; intensity: 0.7"></a-entity>
        <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>

        <a-entity id="modello-fotogrammetrico" 
                  gltf-model="#modello-tomba" 
                  position="0 -0.5 0" 
                  scale="0.8 0.8 0.8"
                  drag-rotate
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
        </a-entity>

        <a-plane color="#222" width="2.8" height="0.4" position="0 1.1 0.2" opacity="0.8"></a-plane>
        <a-text value="Rotazione automatica attiva. Trascina per esplorare." align="center" color="white" position="0 1.1 0.3" width="3.5"></a-text>

        <a-entity id="btn-indietro" position="0 -1.2 0" link-to="grotta.html">
          <a-box color="#ff3333" width="1.2" height="0.3" depth="0.1"></a-box>
          <a-text value="TORNA ALLA GROTTA" align="center" color="white" position="0 0 0.06" width="3.5"></a-text>
        </a-entity>

      </a-entity>

    </a-scene>
  </body>
</html>
